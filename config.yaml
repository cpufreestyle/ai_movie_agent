# ============================================================
# AI 电影 Agent 配置
# 本地持续创作的 AI 电影生成器，视频引擎基于 SkyReels-V2 (Diffusion Forcing)
# ============================================================

project:
  title: "《看见未来之前》"
  # 主题/世界观，会作为剧本大模型的系统设定
  theme: "一部发生在近未来赛博都市的科幻短片，探讨记忆与身份"
  # 视觉风格，会拼接到每个分镜提示词里
  style: "cinematic, film grain, 35mm, dramatic lighting, slow camera movement"
  # 单集目标时长（秒），仅用于展示进度；真正的"持续创作"靠循环
  episode_seconds: 60
  # 每个分镜生成的帧数（97 帧 @24fps ≈ 4 秒）。可改 145≈6s
  scene_frames: 97

engine:
  # SkyReels-V2 仓库的本地路径。该引擎目前只支持 SkyReels，不可用 MinimaxH3 直接替代。
  # Windows + MinimaxH3 可先使用 pipeline / WebUI 的企划、剧本和关键帧阶段。
  skyreels_repo: "./skyreels_v2"
  # 模型：本地 16G 显存推荐 1.3B-540P；有 48G+ 可换 14B
  model_id: "Skywork/SkyReels-V2-DF-1.3B-540P"
  resolution: "540P"
  offload: true                 # 显存不足时把模型卸载到 CPU
  fps: 24
  # Diffusion Forcing 长视频一致性参数
  ar_step: 0
  overlap_history: 17
  addnoise_condition: 20
  base_num_frames: 97
  guidance_scale: 6.0
  inference_steps: 30
  # I2V 二次续写：有起始关键帧时，先以关键帧做 I2V 生成起始片段，再对该片段跑一轮 DF 续写/精修
  two_pass_i2v: true
  # 生成用的 python（setup 会装好 venv 并自动探测）
  python: ""

llm:
  # 本地 LLM 通过 OpenAI 兼容接口接入（默认 Ollama）。
  # 启用步骤：1) ollama serve   2) ollama pull qwen2.5:14b（或下方任一模型）
  # Ollama 离线 / 未配置时自动降级为模板生成，管线照样能跑通（bible 为派生内容）。
  base_url: "http://localhost:11434/v1"   # Ollama 默认地址；也可指向云端或其它 OpenAI 兼容服务
  api_key: "ollama"                        # Ollama 随意填；其它服务填真实 key
  # 模型 tag（ollama 拉取的模型名）。按显存/质量选一个：
  model: "qwen2.5:7b"                       # 16GB 显存建议先用 7b；执行 ollama pull qwen2.5:7b 后再启用
  # model: "qwen2.5:7b"                    # 轻量，~8G 显存可用
  # model: "llama3.1:8b"                   # 备选
  # model: "deepseek-r1:14b"              # 长思维链，适合复杂企划（慢）
  temperature: 0.85                         # 企划偏创意，略高；要稳定可降到 0.6
  # disabled: true 可强制纯模板（无 GPU / 没模型时先跑通流程）
  disabled: true                             # 当前 Ollama 未安装模型；拉取模型后改为 false

# 可复用的模型/接口档案。新增同类档案后，在 stage_profiles 为各阶段选择即可。
profiles:
  llm:
    ollama_lfm:
      base_url: "http://127.0.0.1:11434/v1"
      api_key: "ollama"
      model: "lfm2.5-thinking"
      temperature: 0.85
      disabled: false
    template:
      disabled: true
  comfyui:
    minimax_h3:
      api: "http://127.0.0.1:8188"
      workflow: ""
  engine:
    skyreels_wsl:
      skyreels_repo: "./skyreels_v2"
      model_id: "Skywork/SkyReels-V2-DF-1.3B-540P"
      resolution: "540P"
      offload: true
      fps: 24
      scene_frames: 97
  collector:
    local_requests:
      enabled: true
      method: "requests"
  knowledge:
    local:
      enabled: true
      backend: "local"
  publish:
    disabled:
      enabled: false

# 每个阶段使用哪个接口档案。C/E/F/G 使用 llm；D 同时使用 llm 和 comfyui。
stage_profiles:
  A:
    collector: "local_requests"
  B:
    knowledge: "local"
  C:
    llm: "ollama_lfm"
  D:
    llm: "ollama_lfm"
    comfyui: "minimax_h3"
  E:
    llm: "ollama_lfm"
  F:
    llm: "ollama_lfm"
  G:
    llm: "ollama_lfm"
    engine: "skyreels_wsl"
  H:
    publish: "disabled"

# ============================================================
# A 阶段 · 资料采集（Crawl4AI）
# ============================================================
collector:
  enabled: true
  method: "requests"          # crawl4ai | requests；装了 crawl4ai 改 crawl4ai
  urls: []                    # 起始采集链接；留空则跳过 A 阶段
  save_dir: "material"        # 相对 workdir，存抓取文本

# ============================================================
# B 阶段 · 知识沉淀（RAGFlow / 本地）
# ============================================================
knowledge:
  enabled: true
  # 默认读 RAGFlow 云端后端；未配置 api/api_key 时自动降级到 local，不影响管线
  backend: "ragflow"          # local | ragflow
  local_dir: "kb"
  ragflow:
    api: "http://localhost:80/api"
    dataset: "ai_movie"
    api_key: ""

# ============================================================
# C 阶段 · 概念企划（MetaGPT 多角色法）
# ============================================================
planner:
  enabled: true
  roles: ["编剧", "导演", "制片人"]   # MetaGPT 风格角色分工

# ============================================================
# D 阶段 · 图像提示词 / 关键帧（ComfyUI）
# ============================================================
image_prompt:
  enabled: true
  comfyui:
    api: "http://127.0.0.1:8188"     # MinimaxH3 启动后提供的 ComfyUI API 地址
    # 在 MinimaxH3 的 ComfyUI 页面启用 Developer mode 后，将可用工作流另存为 API Format，
    # 再把该 JSON 的 Windows 绝对路径填到这里。
    workflow: ""

# ============================================================
# F 阶段 · 去 AI 味润色（qu-ai-wei 方法论）
# ============================================================
polisher:
  enabled: true
  method: "llm"              # llm | qu-ai-wei | none

output:
  dir: "./outputs"

# ============================================================
# 发布（H 阶段）：自动投稿到 B 站，封装开源工具 biliup-rs
# 使用前先手动执行一次 `biliup login`（扫码/密码，写入 cookies.json）
# ============================================================
publish:
  enabled: false             # Windows 初装默认禁止自动投稿；完成 biliup 登录和文案确认后再启用
  # biliup-rs 可执行文件（tools/ 下已下载 v0.2.4；执行 `biliup login` 后才能投稿）
  binary: ""
  account: ""                 # 多账号时填 cookie 文件名（-u 参数），留空用默认 cookies.json
  # 投稿模板，支持占位符 {title} {n} {logline}
  title_template: "{title} · 第{n}集"
  desc_template: |
    片名《看见未来之前》——一部由本地 AI 电影 Agent 自动企划、生成的概念短片 demo。

    这个 Agent 能做什么：
    · 持续创作 / 无限时长：基于 SkyReels-V2 的 Diffusion Forcing 续写，影片可一直生长；
    · 全链路自动化：素材采集 → 知识沉淀 → 概念企划 → 关键帧 → 剧本 → 去 AI 味润色 → 视频导演 → 自动投稿 B 站；
    · 本地 LLM 自动写剧本（无模型也能跑通模板兜底）。

    用 AI 提前看见未来——让 Agent 把一句话创意变成可投稿的影像。
    #魔搭社区 #Qoder #AI无限开发者创作大赛 #用AI提前看见未来 #AIGC
  tags: "AI影视,人工智能,短片,AIGC,打赏,AI电影,开源项目"
  tid: 171                    # 投稿分区（171=科技/野生技术？投稿前请核对 B 站 tid 表）
  source: ""                  # 转载来源（仅当 copyright=2 时需填；自制留空）
  dynamic: "AI 自动生成的实验短片"
  cover: ""                   # 可选封面图路径；留空则由 B 站自动选帧
  dtime: 0                    # 0=立即发布；或填 10 位时间戳延时（需晚于当前 4 小时以上）
