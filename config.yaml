project:
  title: 《看见未来之前》
  theme: 一部发生在近未来赛博都市的科幻短片，探讨记忆与身份第三集
  style: anime style, cel-shaded 2D animation, clean line art, vibrant colors, detailed background art, dramatic lighting, slow camera movement
  episode_seconds: 60
  scene_frames: 97
engine:
  skyreels_repo: ./skyreels_v2
  model_id: Skywork/SkyReels-V2-DF-1.3B-540P
  resolution: 540P
  offload: true
  fps: 24
  ar_step: 0
  overlap_history: 17
  addnoise_condition: 20
  base_num_frames: 97
  guidance_scale: 6
  inference_steps: 30
  two_pass_i2v: true
  python: ''
  backend: comfyui_mmH3
  comfyui_ltx:
    api: http://127.0.0.1:8188
    workflow: workflows/ltx2_5_t2v_api.json
    precision: fp4
    checkpoint: ltx-2.5-22b-distilled-transformer-nvfp4.safetensors
    text_encoder: gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors
    unet_gguf: LTX-2.5-Distilled-Q2_K.gguf
    video_vae: ltx-2.5-video-vae-bf16.safetensors
    audio_vae: ltx-2.5-audio-vae-bf16.safetensors
    resolution: 768x448
    fps: 24
    num_frames: 97
    seed: 0
    negative: ''
    nodes:
      prompt: '5508'
      negative: '5509'
      fps: '5511'
      duration: '5512'
      seed: '5516_4832'
      latent: '5514_3059'
      unet: '5004_5569'
      clip_12b: '5004_5572'
      clip_2b: '5004_5545'
      audio_vae: '5004_5570'
      video_vae: '5004_5571'
      load_image: '2004'
      i2v_enable: '5014_5506'
      prompt_switch: '5014_5556'
    # 质量后处理：同 comfyui_mmH3.post，作用于最终视频保存节点前
    post:
      upscale_model: ''
      sharpen: 0.2
  comfyui_mmH3:
    api: http://127.0.0.1:8188
    unet: minimax_h3_fl2va_pruned_int4_convrot.safetensors
    text_encoder: qwen3vl_32b_minimax_h3_int4_convrot.safetensors
    video_vae: minimax_h3_video_vae_fp16.safetensors
    audio_vae: minimax_h3_audio_vae_fp32.safetensors
    lora: minimax_h3_fl2v_turbo_4step_v1.0_768p_comfyui_bf16.safetensors
    lora_strength: 1.0
    video_steps: 4
    audio_steps: 8
    steps: 30
    resolution: 768x448
    fps: 24
    num_frames: 56
    seed: 0
    timeout: 1800
    filename_prefix: H3/pipe
    # 质量后处理：超分 + 锐化。仅增强图像，音频不动。
    #   upscale_model: ESRGAN 模型文件名（放 ComfyUI models/upscale_models），
    #                  需先自行下载该模型；留空 = 不做超分（留空不会报错，可安全留空）
    #   sharpen:       0~1，>0 启用内置 ImageSharpen 轻度锐化去糊；0 = 关闭（出问题时的兜底）
    post:
      upscale_model: ''
      sharpen: 0.2
    # BlockCache 缓存加速（需自定义节点 comfyui-minimax-h3-blockcache-T8）：
    #   开启后 H3 在目标音视频都稳定时跳过 Block 1-49，只重算 Block 0。
    #   近似缓存，不保证同 seed 无损；运动小的镜头加速明显；与 SageAttention 兼容。
    block_cache:
      enable: false
      threshold: 0.12          # 越高越易命中，也越可能改变结果
      cache_device: cpu        # cpu 省显存 / gpu 少传输但占显存
    # 学习型 latent 二采放大（需 H3 内置二采节点 + latent upscaler 模型，
    # 模型放 ComfyUI models/latent_upscale_models/minimax_h3_latent_upscaler_3d_fp16.safetensors）：
    #   一采低清 → 3D latent 放大 → 二采高清。EXP 路线，单样本不证画质增益；
    #   开启后一采走 DualClock（非 Turbo 双速率），比单采慢。
    two_pass:
      enable: false
      model_name: minimax_h3_latent_upscaler_3d_fp16.safetensors
      scale_by: 1.5            # 放大倍数（一采尺寸 × scale_by = 二采尺寸）
      base_steps: 8            # 一采总步数（= coarse + refine）
      coarse_steps: 4          # 一采低清段步数
      refine_steps: 4          # 二采高清段步数
# 逐镜自动质检（出片后打分；不达标自动换 seed 重出）
#   阈值默认取「只抓明确崩坏」（全黑/全白/静帧/糊成一团），避免误判浪费 GPU 时间。
#   先跑几集，看 outputs/series_shots*/qa_report.json 的 summary 分布，再按需收紧。
#   命令行覆盖：--no-qa 关闭；--qa-rerolls N 改自动重出次数。
#   单独给视频打分：python -m agent.qa <视频路径> [--char --anchor <锚定图>]
qa:
  enabled: true
  sample_frames: 9        # 每镜抽样帧数
  max_rerolls: 1          # 不达标时换 seed 重出的次数上限（0 = 只报告不重出）
  # ---- 风格无关指标（默认启用，只用 opencv+numpy，无额外依赖）----
  min_sharpness: 5.0      # 拉普拉斯方差下限，低=糊/涂抹；0 = 不检查
  min_motion: 0.5         # 相邻帧平均差下限，低=静帧/卡死；0 = 不检查
  max_motion: 0.0         # 上限，高=抖动闪烁；0 = 不检查（普适阈值难定，默认只报告）
  min_brightness: 8.0     # 灰度均值下限，抓全黑；0 = 不检查
  max_brightness: 247.0   # 灰度均值上限，抓全白；0 = 不检查
  # ---- 人脸类指标（需 insightface + 锚定图）----
  #   注意：opencv 自带 Haar 只认真实人脸，对**动漫脸基本失效**；本项目默认动漫风格，
  #   故默认关闭，否则会大量误判并白白重 roll GPU。装好 insightface 后再置 true。
  face_check: false
  min_face_ratio: 0.34    # 检出人脸的采样帧占比下限
  min_identity: 0.35      # arcface 余弦：>0.6 同一人，0.35~0.6 偏弱，<0.35 基本换人
# 提示词默认值（负向提示词库）
#   negative 可写预设名 quality / identity / anime，也可直接写一整串（非预设名时按字面处理）。
#   注意 1：引擎级 engine.comfyui_ltx.negative 更具体，写了就以它为准。
#   注意 2：MiniMax H3 **没有负向提示词输入**（T8 采样器走 flow matching / shift，
#           BasicGuider 只有 model + conditioning），给它配负向不会生效。
prompting:
  negative: quality
# 系列级配置
series:
  # 角色卡（角色锚定图）：--anchor auto 优先用它；文件不存在则回退到
  # outputs/anchor/*anchor*.png → mira_*.png
  character_anchor: outputs/anchor/mira_anchor.png
