project:
  title: 《看见未来之前》
  theme: 一部发生在近未来赛博都市的科幻短片，探讨记忆与身份第三集
  style: cinematic, film grain, 35mm, dramatic lighting, slow camera movement
  episode_seconds: 60
  scene_frames: 97
engine:
  skyreels_repo: ./skyreels_v2
  model_id: Skywork/SkyReels-V2-DF-1.3B-540P
  resolution: 540P
  offload: true
  fps: 24
  ar_step: 0
  overlap_history: 17
  addnoise_condition: 20
  base_num_frames: 97
  guidance_scale: 6
  inference_steps: 30
  two_pass_i2v: true
  python: ''
  backend: comfyui_mmH3
  comfyui_ltx:
    api: http://127.0.0.1:8188
    workflow: workflows/ltx2_5_t2v_api.json
    precision: fp4
    checkpoint: ltx-2.5-22b-distilled-transformer-nvfp4.safetensors
    text_encoder: gemma4-12b-with-proj-ltx-2.5-comfy-int8-convrot.safetensors
    unet_gguf: LTX-2.5-Distilled-Q2_K.gguf
    video_vae: ltx-2.5-video-vae-bf16.safetensors
    audio_vae: ltx-2.5-audio-vae-bf16.safetensors
    resolution: 768x448
    fps: 24
    num_frames: 97
    seed: 0
    negative: ''
    nodes:
      prompt: '5508'
      negative: '5509'
      fps: '5511'
      duration: '5512'
      seed: '5516_4832'
      latent: '5514_3059'
      unet: '5004_5569'
      clip_12b: '5004_5572'
      clip_2b: '5004_5545'
      audio_vae: '5004_5570'
      video_vae: '5004_5571'
      load_image: '2004'
      i2v_enable: '5014_5506'
      prompt_switch: '5014_5556'
    # 质量后处理（默认关闭）：同 comfyui_mmH3.post，作用于最终视频保存节点前
    post:
      upscale_model: ''
      sharpen: 0.0
  comfyui_mmH3:
    api: http://127.0.0.1:8188
    unet: minimax_h3_fl2va_pruned_int4_convrot.safetensors
    text_encoder: qwen3vl_32b_minimax_h3_int4_convrot.safetensors
    video_vae: minimax_h3_video_vae_fp16.safetensors
    audio_vae: minimax_h3_audio_vae_fp32.safetensors
    lora: minimax_h3_fl2v_turbo_4step_v1.0_768p_comfyui_bf16.safetensors
    lora_strength: 1.0
    video_steps: 4
    audio_steps: 8
    steps: 30
    resolution: 768x448
    fps: 24
    num_frames: 56
    seed: 0
    timeout: 1800
    filename_prefix: H3/pipe
    # 质量后处理（默认关闭）：超分 + 锐化。仅增强图像，音频不动。
    #   upscale_model: ESRGAN 模型文件名（放 ComfyUI models/upscale_models），如 4x-UltraSharp.pth；留空=不超分
    #   sharpen:       0~1，>0 启用内置 ImageSharpen；0=关闭
    post:
      upscale_model: ''
      sharpen: 0.0
