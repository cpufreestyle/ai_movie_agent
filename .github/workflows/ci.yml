name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: compile + smoke test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: 语法检查（compileall）
        # 根目录的独立出片脚本同样纳入——它们不在 pytest 覆盖范围内，
        # 改动后至少要有语法级兜底（含 run_series / make_narration / face_swap_ep 等）。
        run: python -m compileall -q agent tools tests webserver cli.py webui.py comfy_paths.py config_env.py run_series.py make_narration.py face_swap_ep.py anime_redraw.py upscale_video.py deploy.py monitor_upload.py download_ltx25_gguf.py

      # 规则集固化在仓库根目录 ruff.toml（E9,F63,F7,F82 + F 全类 + C901 复杂度门槛），
      # 本地与 CI 行为一致；不再用 continue-on-error 掩盖问题。
      - name: Lint（ruff，使用仓库 ruff.toml）
        run: ruff check .

      - name: 冒烟测试（脚本，覆盖降级路径）
        run: python tests/smoke_test.py

      - name: 冒烟测试（pytest 收集）
        run: pytest -q tests/
