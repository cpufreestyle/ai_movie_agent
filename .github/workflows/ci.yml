name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: compile + smoke test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.12" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: 语法检查（compileall）
        run: python -m compileall -q agent tools tests cli.py webui.py comfy_paths.py config_env.py

      - name: Lint（仅致命问题：语法错误 / 未定义名）
        continue-on-error: true
        run: ruff check . --select E9,F63,F7,F82 --exclude legacy

      - name: 冒烟测试（脚本，覆盖降级路径）
        run: python tests/smoke_test.py

      - name: 冒烟测试（pytest 收集）
        run: pytest -q tests/
