publish:
  enabled: false
  binary: tools/biliup/biliupR-v0.2.4-x86_64-windows/biliup.exe
  account: ''
  title_template: '{title} · 第{n}集'
  desc_template: '片名《看见未来之前》——一部由本地 AI 电影 Agent 自动企划、生成的概念短片 demo。


    这个 Agent 能做什么：

    · 持续创作 / 无限时长：基于 SkyReels-V2 的 Diffusion Forcing 续写，影片可一直生长；

    · 全链路自动化：素材采集 → 知识沉淀 → 概念企划 → 关键帧 → 剧本 → 去 AI 味润色 → 视频导演 → 自动投稿 B 站；

    · 本地 LLM 自动写剧本（无模型也能跑通模板兜底）。


    用 AI 提前看见未来——让 Agent 把一句话创意变成可投稿的影像。

    #魔搭社区 #Qoder #AI无限开发者创作大赛 #用AI提前看见未来 #AIGC

    '
  tags: AI影视,人工智能,短片,AIGC,打赏,AI电影,开源项目
  tid: 174
  source: ''
  dynamic: AI 自动生成的实验短片
  cover: ''
  dtime: 0
blender:
  enabled: true
  host: 127.0.0.1
  port: 9876
  width: 1280
  height: 720
  # 灰模动画帧数。auto = 自动对齐出片帧数（engine.comfyui_mmH3.num_frames），
  # 并按 2s 下限兜底；也可直接写整数。
  # @24fps 换算：24帧=1.0s、48帧=2.0s。H3 的 reference_video_policy 是官方 2~15s，
  # 低于 2s 不满足 ref_video 要求，故 auto 会强制 ≥48 帧（2.0s）。
  anim_frames: auto
  use_llm_parse: false
  # ---- 白模 -> 视频 流程接线：把白模资产喂给视频引擎（原先完全没接，白模只用于概念片配图）----
  #   use_as_i2v_start: 用白模 previs 图作视频首帧(I2V)，锁构图/站位/机位
  #   use_as_ref_images: 把白模控制图(depth/normal/line)作参考图(ref_images)喂引擎
  #   use_as_ref_video:  把白模灰模动画作参考视频(ref_video)喂引擎（锁走位/运镜）
  #   注意：H3 里 image(首帧) 与参考媒体同时给会走 Hybrid 任务，属正常；单独 image 走 I2VA。
  use_as_i2v_start: false      # 白模 previs 作 H3 首帧(I2V start)，锁构图/站位/机位；已配合 Mira 锚定图(ref_image)防变灰模
  #   "白模负责走位→H3渲染" 推荐落地：python run_blocking_i2v.py --walk x1,y1:x2,y2 --no-track --ab
  use_as_ref_images: true      # 【已开启】控制图 depth/normal/line -> ref_images（A/B 表现良好）
  # 【默认关闭】灰模运镜 mp4 -> ref_video。2026-09-11 A/B 实测（同 seed、同首帧+同 3 张控制图）：
  #   开：motion mag 0.123 / 耗时 365s / 人脸生硬、构图漂移；
  #   关：motion mag 0.299 / 耗时  67s / 画面自然、接近原角色。
  #   结论：白模 ref_video 既没把运镜"锁"过去（参考 +dx 右移，出片 ≈0 甚至反向），
  #   反而压制运镜、拉低画质一致性，且耗时 5.4 倍。要再试时置 true，
  #   并用 `python _exp_ref_video.py [<灰模.mp4>]` 与 `--no-ref-video` 做同 seed 对照。
  # 【2026-09-14 补测】连"角色走位灰模"(walk 左→右)作 ref_video 也左移(dx-0.39)且慢 1.7×(95s)，
  #   走位方向照样不传 → 彻底弃用 ref_video。白模只走 I2V 首帧(use_as_i2v_start + 锚定 ref) 弱锁构图/站位。
  use_as_ref_video: false
  #   use_as_fun_control: 白模**走位 depth 序列**作 H3 Fun Control 的 control_video（逐帧注入 DiT）。
  #     ★ 这是"白模负责走位"唯一实测有效的路径（ref_video / 首帧都传不动走位；见 docs/h3_blocking_guide.md §九）。
  #     走位用**归一化坐标**（x: -1=画面左 / +1=画面右；y: -1=近 / +1=远），支持多点折线
  #     'x,y:x,y:...'（按累计弧长匀速）；模板按镜头距离自动换算世界坐标并留边距 → 角色全程不出画。
  #     分镜文本里的"从左到右/走近镜头/来回/绕圈"等会被 parse_spec 识别并覆盖下面的默认走位。
  #     需 H3 的 FunControl 节点（comfyui-minimax-h3-audio-T8）+ 控制权重
  #     minimax_h3_fun_controlnet_union_pruned_int8_convrot.safetensors（放 models/model_patches）。
  #     引擎侧强度/生效区间见 engine.comfyui_mmH3.fun_control。
  use_as_fun_control: false
  fun_control_walk: "-1,0:1,0"   # 归一化走位 'x,y[:x,y...]'；留空 = 只用分镜文本识别的走位
  fun_control_strength: 1.2      # Fun Control 强度：0.8 干净弱 / 1.2 明显强 / >=1.5 画面崩坏
  # ---- 渲染性能 / 健壮性（本次优化新增）----
  engine: auto            # auto=优先 EEVEE(GPU)失败自动降级 CYCLES / eevee / cycles（cycles 最稳但最慢）
  samples: 24             # 采样数，白模可降到 8~24，越低越快
  timeout: 180            # 单次静帧渲染 socket 超时(秒)
  anim_timeout: 900       # 灰模动画渲染 socket 超时(秒)，逐帧渲染耗时更长
  retries: 2              # 渲染失败重试次数（逐级降级：合并渲染+EEVEE -> CYCLES -> 逐张渲染）
  reuse_scene: true       # 同集连续同几何分镜复用场景（只更新相机），多镜时显著提速
  depth_near: 0.1         # depth 图归一化近平面（固定值，保证动画多帧深度一致）
  depth_far: 100.0        # depth 图归一化远平面
  # ---- 4 张控制图的引擎分工（2026-09-14 真机实测 Blender 5.2.1 @1280x720）----
  #   原先模板只在 line pass 前设一次 CYCLES，depth/normal 紧随其后没有任何回切，
  #   于是两个纯 emission 材质的控制图也一直白跑 CYCLES。
  #   单镜 4 图实测：旧 ~9.75s -> 新默认 ~5.78s（1.7x）-> 再开 line_engine=eevee ~1.24s（7.9x）
  fast_control_passes: true
  #   true（默认）：depth/normal 回切快速引擎（EEVEE）。产物与 CYCLES 版逐像素比对
  #     仅在**轮廓抗锯齿**上有差（1280x720：depth 0.08% 像素、normal 0.43% 像素，
  #     且几乎全在边缘；内部差异 depth 2 px、normal 49 px / 230k），控制图语义不变。
  #   false：完全回到旧行为（depth/normal 继承 CYCLES），慢约 4s/镜。
  line_engine: cycles
  #   line 线框 pass 用哪个引擎出 freestyle：
  #     cycles（默认）：与历史基线逐像素一致，单镜约 4.9s。
  #     eevee：实测也能出 freestyle 线（暗像素 0.84% vs Cycles 0.70%，线条掩膜 IoU 72.9%），
  #            单镜 4.9s -> 0.39s（12x）。line.png 是喂视频引擎的控制图，与已做过的 A/B
  #            基线不完全同源，故默认不开；要做提速 A/B 时再置 eevee。
  #   注：BLENDER_WORKBENCH 更快但会忽略材质节点（depth/normal 材质法失效），已排除。

