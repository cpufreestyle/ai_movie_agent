#
# 三种选法（任一即可，优先级 HW_TIER 环境变量 > 本文件）：
#   1) 环境变量：HW_TIER=amd395-128g    （另可 AUTO_HW=1 自动检测本机）
#   2) 部署入口：python deploy.py --gpu amd --tier amd395-128g
#   3) 本文件：  取消文件末尾两行的注释
#
# 可选档位：high / mid / low / cpu / amd395-128g
#   amd395-128g = AMD Ryzen AI Max+ 395（Strix Halo, 128GB 统一内存）
#     效果：LTX 精度钉死 bf16、1024x576 / 90 帧、开 block_cache 与两遍采样、
#           不 offload、Blender 64 采样、QA 允许 3 次 reroll。
#     别名：amd395 / amd-395 / 395 / strix-halo / ai-max-395-128g
#     为何单列一档：该机「显存」由统一内存切出（BIOS 的 UMA Frame Buffer），
#     Windows WMI 会把 iGPU 报成 512MB~4GB、Linux lspci 报 0，自动检测会误判成
#     cpu 档；故改用「AMD + 内存 ≥96GB + 型号线索」来识别。
#     部署前务必先在 BIOS 把 UMA Frame Buffer Size 设为 75–96GB。
#
# 查看将应用的覆盖（dry-run，不改文件）：python tools/hw_profile.py --tier amd395
# 写回本文件（追加 auto_hardware / hw_tier）：python tools/hw_profile.py --tier amd395 --write
